apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.usagetelemetry'
version = '1.0.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()

android {
  namespace 'expo.modules.usagetelemetry'
  compileSdkVersion 34
  buildToolsVersion "34.0.0"

  defaultConfig {
    minSdkVersion rootProject.hasProperty("minSdkVersion") ? rootProject.minSdkVersion : 23
    targetSdkVersion 34
    versionCode 1
    versionName "1.0.0"
    consumerProguardFiles("proguard-rules.pro")
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }
}

dependencies {
  implementation project(':expo-modules-core')
  implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"

  // AndroidX WorkManager for persistent background jobs
  implementation "androidx.work:work-runtime-ktx:2.9.0"

  // Core KTX
  implementation "androidx.core:core-ktx:1.12.0"
}
