# ==============================================================================
# Aegis Student Telemetry Platform: Production Orchestration Stack
# TimescaleDB 16 + Redis 7 + Fastify Ingestion API + Next.js + Nginx SSL Proxy
# ==============================================================================

version: '3.8'

services:
  # 1. TimescaleDB (PostgreSQL 16 + TimescaleDB Extension)
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: aegis-timescaledb
    restart: always
    environment:
      POSTGRES_DB: telemetry_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-AegisSecurePass2026!}
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./services/backend/src/db/migrations/001_create_telemetry_schema.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d telemetry_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aegis-internal-net

  # 2. Redis 7 (In-Memory Deduplication & Caching with Auth)
  redis:
    image: redis:7-alpine
    container_name: aegis-redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-AegisRedisSecret2026!}", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-AegisRedisSecret2026!}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aegis-internal-net

  # 3. Fastify Telemetry Ingestion API (Clustered Node.js, Non-Root)
  backend:
    build:
      context: ./services/backend
      dockerfile: Dockerfile
    container_name: aegis-backend
    restart: always
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-AegisSecurePass2026!}@timescaledb:5432/telemetry_db
      DATABASE_POOL_MAX: 30
      DATABASE_IDLE_TIMEOUT_MS: 30000
      REDIS_URL: redis://:${REDIS_PASSWORD:-AegisRedisSecret2026!}@redis:6379
      REDIS_DEDUP_TTL_SEC: 86400
      JWT_SECRET: ${JWT_SECRET:-aegis-production-secret-token-key-2026-xyz}
      JWT_EXPIRY: 7d
      CORS_ORIGIN: "*"
      LOG_LEVEL: info
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health/live"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - aegis-internal-net

  # 4. Web Management Dashboard (Next.js 14 Standalone)
  dashboard:
    build:
      context: ./apps/dashboard
      dockerfile: Dockerfile
    container_name: aegis-dashboard
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_BACKEND_URL: ""
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - aegis-internal-net

  # 5. Nginx Production Reverse Proxy (SSL Termination + SSE + WebSocket)
  nginx:
    image: nginx:alpine
    container_name: aegis-proxy
    restart: always
    depends_on:
      - backend
      - dashboard
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - aegis-internal-net

networks:
  aegis-internal-net:
    driver: bridge

volumes:
  timescaledb_data:
    driver: local
  redis_data:
    driver: local
